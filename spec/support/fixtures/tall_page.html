<!DOCTYPE html>
<html>
  <head>
    <title>Tall Scroll Test Page</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        padding: 10px;
      }

      .section {
        height: 400px;
        border: 2px solid #333;
        padding: 20px;
        box-sizing: border-box;
        background: #ffffff;
      }

      .section:nth-child(even) {
        background: #eeeeee;
      }

      .marker {
        font-size: 24px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="grid" id="test-grid"></div>
    <script>
      const rows = 50;
      const columns = 3;
      const grid = document.getElementById("test-grid");
      let counter = 1;

      for (let row = 1; row <= rows; row++) {
        for (let column = 1; column <= columns; column++) {
          const div = document.createElement("div");

          div.id = `cell-${row}-${column}`;
          div.className = `section row-${row} column-${column}`;
          div.innerHTML = `
            <div class="marker">
              Cell ${counter}
            </div>
            <p>
              Row: ${row}<br>
              Column: ${column}<br>
              Unique marker: cell-${row}-${column}
            </p>
          `;

          grid.appendChild(div);
          counter++;
        }
      }
    </script>
  </body>
</html>
